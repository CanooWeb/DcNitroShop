<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- face -->
  <ellipse cx="400" cy="360" rx="215" ry="265" fill="#b7b0a3"/>

  <!-- cracked skin -->
  <path d="M210 300 Q260 340 240 400" stroke="#7a7266" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M560 250 Q610 300 585 380" stroke="#7a7266" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M360 120 Q400 160 430 130" stroke="#7a7266" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- eye sockets -->
  <ellipse cx="300" cy="330" rx="62" ry="78" fill="#120503"/>
  <ellipse cx="500" cy="330" rx="62" ry="78" fill="#120503"/>

  <!-- tiny pupils -->
  <circle cx="308" cy="340" r="12" fill="#fff" opacity="0.95"/>
  <circle cx="492" cy="340" r="12" fill="#fff" opacity="0.95"/>

  <!-- nose -->
  <path d="M370 400 L400 470 L430 400 Q400 430 370 400 Z" fill="#9c9487"/>

  <!-- huge mouth -->
  <path d="M245 470 Q400 795 555 470 Z" fill="#150200"/>

  <!-- top teeth -->
  <path d="M248 470 L288 525 L328 478 L368 540 L408 486 L448 530 L488 476 L528 524 L552 470 Z" fill="#e9e3d3"/>
  <!-- bottom teeth -->
  <path d="M265 600 L300 552 L340 605 L380 556 L420 606 L460 558 L500 604 L535 556 L545 590 L245 700 L252 662 L265 600 Z" fill="#ddd7c6" opacity="0.92"/>

  <!-- blood drip -->
  <path d="M380 640 Q385 700 400 745 Q415 700 420 640 Z" fill="#7a0d0d"/>
</svg>